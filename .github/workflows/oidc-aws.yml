name: OIDC to AWS (example)

# This shows how a pipeline gets AWS access without any stored key:
# GitHub signs a short-lived token for the run, AWS trusts that token
# and hands back temporary credentials for one IAM role.
#
# It only runs when started by hand, and it needs a role that you create
# first (see docs/oidc.md). Nothing in this repository runs it by itself.
on:
  workflow_dispatch:
    inputs:
      role_arn:
        description: IAM role to assume, for example arn:aws:iam::123456789012:role/github-terraform
        required: true
      environment:
        description: Terraform environment folder
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write # lets the job ask GitHub for the OIDC token
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      # Real AWS, so no localstack_endpoint and a real backend file.
      - name: Plan
        working-directory: envs/${{ inputs.environment }}
        run: |
          terraform init -input=false -backend-config=backend-aws.hcl
          terraform plan -input=false
