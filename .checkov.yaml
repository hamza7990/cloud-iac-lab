directory:
  - .
framework:
  - terraform
quiet: true
compact: true

# Every skipped check is a decision, written down here with the reason.
# Nothing else is skipped: a new finding fails the pipeline.
skip-check:
  # S3 (storage module and the state bucket)
  - CKV_AWS_144 # cross-region replication: a lab does not need a second region
  - CKV_AWS_145 # KMS key on S3: AES256 is on, a customer key adds cost and a key policy to explain
  - CKV2_AWS_61 # lifecycle: present in the storage module, the state bucket keeps all versions on purpose
  - CKV2_AWS_62 # event notifications: nothing consumes bucket events
  - CKV_AWS_18  # access logging: would need a second log bucket
  # DynamoDB and CloudWatch
  - CKV_AWS_119 # DynamoDB customer KMS key: default AWS-owned encryption is enough here
  - CKV_AWS_158 # log group KMS key: same reason
  - CKV_AWS_338 # log retention of at least 1 year: dev keeps 7 days on purpose, prod uses 365
  # Lambda
  - CKV_AWS_50  # X-Ray tracing: not needed for the lab
  - CKV_AWS_116 # dead letter queue: the function is called synchronously
  - CKV_AWS_117 # run inside a VPC: it only talks to DynamoDB and a VPC needs a NAT or endpoints
  - CKV_AWS_173 # KMS key for environment variables: they hold no secrets
  - CKV_AWS_272 # code signing: out of scope
  - CKV_AWS_115 # reserved concurrency: no traffic to protect against
  # Network
  - CKV2_AWS_11 # VPC flow logs: need a log destination, listed under "what I would add next"
  - CKV2_AWS_5  # security groups not attached: they are outputs for the EC2 or load balancer a real stack adds on top
